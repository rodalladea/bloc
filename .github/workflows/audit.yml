name: Dependency audit
on:
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, .github/workflows/audit.yml, scripts/ci/install-auditor.sh, rust-toolchain.toml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, .github/workflows/audit.yml, scripts/ci/install-auditor.sh, rust-toolchain.toml]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bloc-tools
          key: auditor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/install-auditor.sh', 'rust-toolchain.toml') }}
      - name: Install or reuse pinned auditor
        run: bash scripts/ci/install-auditor.sh
      - run: cargo audit
