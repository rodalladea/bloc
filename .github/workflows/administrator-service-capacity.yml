name: Administrator service capacity
on:
  workflow_dispatch:
  workflow_call:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker pull postgres:17.11-bookworm
      - run: python3 tests/support/native_service_capacity.py --output "${RUNNER_TEMP}/service-capacity"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: administrator-service-${{ runner.arch }}
          path: ${{ runner.temp }}/service-capacity
          if-no-files-found: error
