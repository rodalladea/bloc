name: PR title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          pattern = r'(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_./-]+\))?!?: \S.*'
          if not re.fullmatch(pattern, os.environ['PR_TITLE']):
              print('Use a Conventional Commit title, for example: feat(providers): add validation')
              sys.exit(1)
          PY
