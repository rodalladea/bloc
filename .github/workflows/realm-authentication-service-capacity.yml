name: Realm authentication service capacity
on:
  workflow_dispatch:
    inputs:
      realm_mfa:
        description: Measure complete TOTP sign-ins
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/realm-authentication-service-capacity.yml'
  workflow_call:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker pull postgres:17.11-bookworm
      - name: Measure native service capacity
        env:
          REALM_MFA: ${{ github.event_name == 'pull_request' || inputs.realm_mfa }}
        run: |
          mode=--realm-auth
          if [ "$REALM_MFA" = true ]; then
            mode=--realm-mfa
          fi
          python3 tests/support/native_service_capacity.py "$mode" --output "${RUNNER_TEMP}/realm-service-capacity"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: realm-authentication-service-${{ runner.arch }}
          path: ${{ runner.temp }}/realm-service-capacity
          if-no-files-found: error
