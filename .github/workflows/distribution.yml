name: Distribution
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      reuse: ${{ steps.original.outputs.reuse }}
      run_id: ${{ steps.original.outputs.run_id }}
      candidate: ${{ steps.original.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Admit tag and find original evidence
        id: original
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/distribution/prepare.py
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: prepare
    if: needs.prepare.outputs.reuse != 'true'
    uses: ./.github/workflows/build-images.yml
  platform:
    needs: [prepare, build]
    if: needs.prepare.outputs.reuse != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-build-${{ matrix.arch }}
          path: platform
      - name: Exercise and measure exact OCI image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -o pipefail
          docker run -d --name bloc-test-registry -p 127.0.0.1:5001:5000 registry@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
          python3 scripts/distribution/wait_registry.py
          python3 scripts/distribution/smoke_platform.py --layout platform/image --platform "linux/$ARCH" --capacity-output platform/service-capacity | tee platform/smoke.log
      - name: Preserve platform diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-diagnostics-${{ matrix.arch }}
          path: platform/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-${{ matrix.arch }}
          path: |
            platform/service-capacity/
            platform/smoke.log
          if-no-files-found: error
          retention-days: 14
          overwrite: true
  validate:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-build-amd64
          path: platforms/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-build-arm64
          path: platforms/arm64
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-distribution-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-distribution-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-
            rust-${{ runner.os }}-${{ runner.arch }}-check-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bloc-tools
          key: auditor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/install-auditor.sh', 'rust-toolchain.toml') }}
      - run: bash scripts/distribution/install-tools.sh
      - name: Install workflow test dependencies
        run: python3 -m pip install --requirement tests/requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/node-image
          key: kind-node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/distribution/node-image.sh', 'scripts/distribution/install-tools.sh') }}
      - name: Validate source and cluster suites in parallel
        run: bash scripts/distribution/validate.sh
      - name: Retain validation output pending native measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
          compression-level: 0
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-diagnostics-${{ github.run_attempt }}
          path: evidence/
  complete:
    needs: [prepare, platform, validate]
    if: ${{ !cancelled() && needs.platform.result == 'success' && needs.validate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-candidate
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-amd64
          path: measurements/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-arm64
          path: measurements/arm64
      - name: Bind both native measurements to the validated candidate
        run: python3 scripts/distribution/complete.py --bundle candidate --measurements measurements
      - name: Retain original verified bytes before any publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.prepare.outputs.candidate || format('candidate-ci-{0}', github.sha) }}
          path: candidate/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
  publish:
    needs: [prepare, complete]
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.prepare.result == 'success' && (needs.complete.result == 'success' || needs.prepare.outputs.reuse == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.candidate }}
          path: candidate
          run-id: ${{ needs.prepare.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - run: bash scripts/distribution/install-tools.sh
      - name: Verify and promote without replacement
        run: python3 scripts/distribution/release.py publish --tag "$GITHUB_REF_NAME" --revision "$GITHUB_SHA" --bundle candidate
        env:
          GH_TOKEN: ${{ github.token }}
