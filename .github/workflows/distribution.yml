name: Distribution
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      reuse: ${{ steps.original.outputs.reuse }}
      run_id: ${{ steps.original.outputs.run_id }}
      candidate: ${{ steps.original.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Admit tag and find original evidence
        id: original
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/distribution/prepare.py
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: prepare
    if: needs.prepare.outputs.reuse != 'true'
    uses: ./.github/workflows/build-images.yml
  check:
    needs: prepare
    if: needs.prepare.outputs.reuse != 'true'
    uses: ./.github/workflows/ci.yml
  package:
    needs: [prepare, build, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-build-amd64
          path: platforms/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-build-arm64
          path: platforms/arm64
      - run: bash scripts/distribution/install-tools.sh helm
      - name: Assemble and verify release artifacts
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          python3 scripts/distribution/candidate.py --platform platforms/amd64/image --platform platforms/arm64/image --revision "$GITHUB_SHA" --version "$version"
          python3 scripts/distribution/release.py record --tag "v$version" --revision "$GITHUB_SHA"
      - name: Retain original artifacts before publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.prepare.outputs.candidate || format('candidate-ci-{0}', github.sha) }}
          path: candidate/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
  publish:
    needs: [prepare, package]
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.prepare.result == 'success' && (needs.package.result == 'success' || needs.prepare.outputs.reuse == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.candidate }}
          path: candidate
          run-id: ${{ needs.prepare.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify and promote without replacement
        run: python3 scripts/distribution/release.py publish --tag "$GITHUB_REF_NAME" --revision "$GITHUB_SHA" --bundle candidate
        env:
          GH_TOKEN: ${{ github.token }}
