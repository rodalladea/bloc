name: Administrator hashing spike
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/administrator-spike.yml
      - tools/administrator-spike/**
      - tools/administrator-dependency-probe/**
permissions:
  contents: read
concurrency:
  group: administrator-spike-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Confirm native runner
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          actual=$(docker info --format '{{.Architecture}}')
          case "$actual" in
            x86_64) actual=amd64 ;;
            aarch64) actual=arm64 ;;
          esac
          test "$actual" = "$EXPECTED_ARCH"
      - name: Build isolated benchmark
        run: docker build -t bloc-administrator-spike:local tools/administrator-spike
      - name: Check selected dependency APIs on the native runner
        run: cargo test --manifest-path tools/administrator-dependency-probe/Cargo.toml --locked
      - name: Measure explicit allocator comparison with approved resource bounds
        run: python3 tools/administrator-spike/run.py --mmap-threshold 131072 --output evidence/administrator-spike
      - name: Preserve raw results, including partial failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: administrator-spike-${{ matrix.arch }}
          path: evidence/administrator-spike/
          if-no-files-found: warn
          retention-days: 30
