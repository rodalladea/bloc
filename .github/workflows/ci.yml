name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Test isolated administrator preparation tools
        run: |
          python3 -m unittest discover -s tools/administrator-corpus -v
          python3 -m unittest discover -s tools/administrator-spike -p 'test_*.py' -v
      - name: Documentation
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          pattern = r'(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_./-]+\))?!?: \S.*'
          if not re.fullmatch(pattern, os.environ['PR_TITLE']):
              print('Use a Conventional Commit title, for example: feat(providers): add validation')
              sys.exit(1)
          PY
