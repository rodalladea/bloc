name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-capacity:
    uses: ./.github/workflows/administrator-service-capacity.yml
  check:
    needs: native-capacity
    env:
      BLOC_NATIVE_SERVICE_EVIDENCE: ${{ runner.temp }}/native-service.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: administrator-service-*
          path: ${{ runner.temp }}/native-service
      - name: Join verified native service records
        run: python3 tests/support/combine_native_service_evidence.py "${RUNNER_TEMP}/native-service" "${RUNNER_TEMP}/native-service.json"
      - name: Install pinned chart verification tools
        run: bash scripts/distribution/install-tools.sh
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Documentation
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  setup-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned chart verification tools
        run: bash scripts/distribution/install-tools.sh
      - name: Pull disposable PostgreSQL fixtures
        run: |
          docker pull postgres:17.11-bookworm
          docker pull postgres:18.6-bookworm
      - name: Verify storage and TLS on PostgreSQL 17 and 18
        run: python3 tests/run_storage.py --output evidence/setup-storage
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          pattern = r'(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_./-]+\))?!?: \S.*'
          if not re.fullmatch(pattern, os.environ['PR_TITLE']):
              print('Use a Conventional Commit title, for example: feat(providers): add validation')
              sys.exit(1)
          PY
