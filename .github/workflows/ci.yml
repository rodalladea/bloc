name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      integration: ${{ steps.paths.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess
          base = os.environ['BASE']
          if not base or set(base) == {'0'}:
              relevant = True
          else:
              paths = subprocess.check_output(['git', 'diff', '--name-only', '-z', base, os.environ['HEAD']]).decode().split('\0')
              relevant = any(p.startswith(('src/', 'migrations/', 'templates/', 'assets/', 'tests/', 'charts/', 'deploy/', '.github/workflows/', 'scripts/')) or p in ('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'Dockerfile') for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'integration={str(relevant).lower()}\n')
          PYTHON
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-check-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install pinned chart verification tools
        run: bash scripts/distribution/install-tools.sh helm
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Packaging policy tests
        run: python3 -m unittest discover -s tests/distribution -p 'test_*.py' -v
      - name: Documentation
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  setup-storage:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    strategy:
      fail-fast: false
      matrix:
        major: [17, 18]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-pg${{ matrix.major }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install pinned chart verification tools
        run: bash scripts/distribution/install-tools.sh helm
      - name: Verify administrator, storage and TLS behavior
        run: python3 tests/run_storage.py --major "${{ matrix.major }}" --output evidence/setup-storage
