replicaCount: 1
image:
  repository: ghcr.io/rodalladea/bloc
  # Required for source-chart tests; release packaging injects the verified digest.
  digest: ""
logLevel: info
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}
ingress:
  enabled: false
  className: ""
  hostname: ""
  annotations: {}
  tlsSecretName: ""

# Operator-owned Secret keys: runtime-url, migrator-url, operator-url,
# maintenance-url, ca.crt, abuse-key (exactly 32 binary bytes).
access:
  secretName: bloc-database
  canonicalOrigin: https://bloc.example.test
  trustedProxyCIDRs: 127.0.0.1/32
  migrationJob: false
  operatorPod: false
  maintenanceJob: false
