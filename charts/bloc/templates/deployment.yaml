apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bloc.name" . }}
  labels:
    {{- include "bloc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "bloc.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bloc.selector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bloc
          image: {{ printf "%s@%s" .Values.image.repository (required "image.digest must identify the verified image" .Values.image.digest) | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: BLOC_BIND_ADDR
              value: "0.0.0.0:3000"
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: BLOC_DATABASE_URL_FILE
              value: /run/bloc/runtime-url
            - name: BLOC_DATABASE_CA_FILE
              value: /run/bloc/ca.crt
            - name: BLOC_ABUSE_KEY_FILE
              value: /run/bloc/abuse-key
            - name: BLOC_CANONICAL_ORIGIN
              value: {{ .Values.access.canonicalOrigin | quote }}
            - name: BLOC_TRUSTED_PROXY_CIDRS
              value: {{ .Values.access.trustedProxyCIDRs | quote }}
            - name: MALLOC_MMAP_THRESHOLD_
              value: "131072"
          volumeMounts:
            - name: authority
              mountPath: /run/bloc
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: authority
          secret:
            secretName: {{ .Values.access.secretName | quote }}
            items:
              - key: runtime-url
                path: runtime-url
              - key: ca.crt
                path: ca.crt
              - key: abuse-key
                path: abuse-key
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
