apiVersion: v1
kind: Service
metadata:
  name: {{ include "bloc.name" . }}
  labels:
    {{- include "bloc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    {{- include "bloc.selector" . | nindent 4 }}
