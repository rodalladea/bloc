<div class="ui-field{% if p.protected %} ui-field--row{% endif %}"><label for="{{ f.name }}">{{ f.label }}</label><input id="{{ f.name }}" name="{{ f.name }}" type="{{ f.kind }}" value="{{ f.value }}" placeholder="{{ f.label }}" autocomplete="{{ f.autocomplete }}" aria-describedby="{{ f.name }}-help{% if !f.error.is_empty() %} {{ f.name }}-error{% endif %}" {% if !f.error.is_empty() %}aria-invalid="true"{% endif %}><p class="ui-help" id="{{ f.name }}-help">{{ f.help }}</p>{% if !f.error.is_empty() %}<p class="ui-field-error" id="{{ f.name }}-error">{{ f.error }}</p>{% endif %}</div>
