<div class="ui-field--row"><label for="{{ t.name }}">{{ t.label }}</label><p class="ui-help" id="{{ t.name }}-help">{{ t.help }}</p><div class="setting-control"><div class="two-inputs"><input id="{{ t.name }}" name="{{ t.name }}" type="number" min="1" value="{{ t.value }}" aria-describedby="{{ t.name }}-help{% if !t.error.is_empty() %} {{ t.name }}-error{% endif %}" {% if !t.error.is_empty() %}aria-invalid="true"{% endif %}><select name="{{ t.name }}_unit" aria-label="{{ t.label }} unit">{% for unit in ["seconds", "minutes", "hours", "days"] %}<option value="{{ unit }}" {% if *unit == t.unit %}selected{% endif %}>{{ unit }}</option>{% endfor %}</select></div>{% if !t.error.is_empty() %}<p class="ui-field-error" id="{{ t.name }}-error">{{ t.error }}</p>{% endif %}</div></div>
