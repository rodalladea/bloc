<form action="{{ p.base }}/account/security/preferred" method="post"><input type="hidden" name="csrf" value="{{ p.csrf }}"><input type="hidden" name="epoch" value="{{ p.mfa_epoch }}"><div class="ui-field"><label for="preferred-factor">Preferred factor</label><select id="preferred-factor" name="factor"><option value="">No preference</option>{% for factor in p.mfa_factors %}<option value="{{ factor.id }}" {% if factor.preferred %}selected{% endif %}>{{ factor.label }}{% if !factor.allowed %} · unavailable{% endif %}</option>{% endfor %}</select><p class="ui-help">This changes which allowed factor is offered first. It never overrides realm policy.</p></div><div class="settings-actions"><button type="submit">Save preference</button><a class="ui-button ui-button--secondary" href="{{ p.base }}/account/security">Cancel</a></div></form>
