<p data-webauthn-status role="status" aria-live="polite" hidden>{% if p.state == "mfa-webauthn-authenticate" %}Canceled the prompt? Try again or choose another method.{% endif %}</p>
<form class="access-form--plain" hidden data-ui-pending-heading="Verifying your proof" data-webauthn-form data-webauthn-kind="{% if p.state == "mfa-webauthn-register" %}register{% else %}authenticate{% endif %}" action="{% if p.state == "mfa-webauthn-register" %}{{ p.base }}/account/security/webauthn/register/finish{% else %}{{ p.base }}/mfa/webauthn/finish{% endif %}" data-webauthn-options="{% if p.state == "mfa-webauthn-register" %}{{ p.base }}/account/security/webauthn/register/options{% else %}{{ p.base }}/mfa/webauthn/options{% endif %}" method="post" hx-boost="false">
<input type="hidden" name="csrf" value="{{ p.csrf }}">
{% if p.state == "mfa-webauthn-register" %}<div class="ui-field"><label for="factor-label">Factor name</label><input id="factor-label" name="label" type="text" placeholder="For example, personal laptop" aria-describedby="passkey-setup-help" required><p class="ui-help" id="passkey-setup-help">Follow the browser prompt to create your passkey. Private keys stay with your authenticator.</p></div>{% endif %}
<div class="actions"><button data-webauthn-submit type="submit" hidden>{% if p.state == "mfa-webauthn-register" %}Create passkey{% else %}Use passkey{% endif %}</button></div>
</form>
