[package]
name = "bloc"
version = "0.6.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Open-source identity and access management, built with Rust and HTMX"
repository = "https://github.com/rodalladea/bloc"

[dependencies]
base64 = "0.23"
getrandom = "0.4"
sha2 = "0.11"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
askama = { version = "=0.16.1", default-features = false, features = ["derive", "std"] }
argon2 = "0.6.0"
hmac = "0.13.0"
subtle = "2.6"
ipnet = "2.11"
url = "2.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.test.package.argon2]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
